<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="index.js" defer></script>
    <title>Odin Project: Library</title>
</head>

<body>
    <div class="content-wrapper">
        <table class="library">
        </table>
        <button class="new-book">New Book</button>
        <dialog>
            <form method="post" novalidate>
                <h1 class="title">New Book</h1>
                <hr>
                <div>
                    <div class="field-label-wrapper">
                        <input type="text" name="name" id="name" placeholder=" " required>
                        <label for="name">Name</label>
                    </div>
                    <div class="field-label-wrapper">
                        <input type="text" name="autor" id="autor" placeholder=" " required>
                        <label for="autor">Autor</label>
                    </div>
                    <div class="field-label-wrapper">
                        <input type="number" name="pages" id="pages" placeholder=" " min="15" max="9999" required>
                        <label for="pages">Number of pages</label>
                    </div>
                </div>
                <hr>
                <div>
                    <div class=" field-label-wrapper">
                        <input type="date" name="publishDate" id="publishDate" required>
                        <label for="publishDate">Publish Date</label>
                    </div>
                    <div class="field-label-wrapper">
                        <input type="date" name="entryDate" id="entryDate" required>
                        <label for="entryDate">Entry Date</label>
                    </div>
                </div>
                <hr>
                <div>
                    <div class="field-label-wrapper">
                        <textarea type="text" name="description" id="description" minlength="12" maxlength="96" placeholder=" "
                            required></textarea>
                        <label for="description">Short description (Min. 12 characters Max. 96)</label>
                    </div>
                </div>
                <div>
                    <input type="button" id="close" value="Cancel" />
                    <input type="submit" id="confirm" value="Confirm" />
                </div>
            </form>
        </dialog>
    </div>

</body>

</html>
